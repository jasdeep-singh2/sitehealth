# Builds the solution and runs every test on each pull request and on every push to main.
# A red check on a PR means "don't merge yet".
name: CI

on:
  pull_request:
  push:
    branches: [main]

# If you push again while a run for the same branch is still going, cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Reuse downloaded NuGet packages between runs; a new cache is made when any project file changes
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The build rewrites src/SiteHealth.Api/openapi/openapi.json. If it changed, someone changed the API
      # without committing the new document, and the web app's generated types would be out of date.
      - name: Check the OpenAPI document is up to date
        run: |
          if ! git diff --exit-code -- src/SiteHealth.Api/openapi/openapi.json; then
            echo "::error::openapi.json is out of date. Build the solution and commit src/SiteHealth.Api/openapi/openapi.json."
            exit 1
          fi

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFilePrefix=results"

      # dotnet only warns about packages with known security problems. Here a warning fails the build,
      # so we notice (like the System.Security.Cryptography.Pkcs issue in the EF Core PR).
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see the list above)."
            exit 1
          fi

      # Keep the test results for a week, so a failed run can be inspected from the Actions tab
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  # The React dashboard. Runs at the same time as the .NET job, on its own machine.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci installs exactly what package-lock.json says, so CI uses the same versions as your machine
      - name: Install
        run: npm ci

      # schema.d.ts must match the committed openapi.json; regenerate it and fail if anything changed
      - name: Check the API types are up to date
        run: |
          npm run generate:api
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error::web/src/api/schema.d.ts is out of date. Run 'npm run generate:api' in web/ and commit it."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Type-checks everything (tests included) and makes sure the production build works
      - name: Build
        run: npm run build

      - name: Check for vulnerable packages
        run: npm audit --audit-level=high
